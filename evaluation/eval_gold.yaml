# Graded relevance labels for the MAX77751 datasheet (40 pages).
#
#   2 = page contains a complete answer to the query
#   1 = page contains supporting / partial information
#
# Authored from the SOURCE PDF page text, not from the generated chunks, so the
# set does not simply measure whether retrieval can find text it was derived from.
# Every label was grounded by locating the answering term on the page.
#
# kind:     word   - paraphrased natural language, avoids datasheet symbols
#           symbol - queries the datasheet's own symbol names (VCHGIN_OVLO, TJREG)
#           table  - the answer lives inside a table
#           figure - the answer lives in a diagram or plot
#           multi  - answer legitimately spans several sections
#
# holdout: true  -> excluded from any tuning decision, scored separately.

queries:
  # ---------------- word-form / paraphrased ----------------
  - query: "What battery chemistries are supported by this charger?"
    kind: word
    relevant: {17: 2, 19: 2, 16: 1}
  - query: "What is the highest input voltage the charger can operate from?"
    kind: word
    relevant: {1: 2, 17: 2, 20: 2, 5: 1}
  - query: "How much current can this charger deliver to the battery?"
    kind: word
    relevant: {1: 2, 17: 2, 20: 2}
  - query: "What happens if the chip gets too hot?"
    kind: word
    relevant: {26: 2, 27: 2, 28: 2, 7: 1}
  - query: "How do I make the charger produce 5V for a USB accessory?"
    kind: word
    relevant: {27: 2, 29: 2, 20: 1, 17: 1}
  - query: "What should I do with the USB pins if I am not using USB power?"
    kind: word
    holdout: true
    relevant: {36: 2}
  - query: "How should I lay out the printed circuit board?"
    kind: word
    relevant: {36: 2}
  - query: "Which capacitor dielectric type should I use?"
